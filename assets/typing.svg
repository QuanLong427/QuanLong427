<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 560 50'
    style='background-color: #00000000;'
    width='560px' height='50px'>

    <style>
@font-face {
  font-family: 'Nunito';
  font-style: normal;
  font-weight: 600;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d1.end'
                    dur='6800ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h560 ; m0,25 h560 ; m0,25 h0' keyTimes='0;0.58823529411765;0.85294117647059;1' />
                    </path>
    <text font-family='"Nunito", monospace' fill='#2268F7' font-size='24'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            持续学习，迭代自我
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='6800ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h560 ; m0,25 h560 ; m0,25 h0' keyTimes='0;0.58823529411765;0.85294117647059;1' />
                    </path>
    <text font-family='"Nunito", monospace' fill='#2268F7' font-size='24'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            dream of owning 1k stars
        </textPath>
    </text>
</svg>
